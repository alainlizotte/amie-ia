# Configuration Ami(e) IA — copier vers config/config.yaml puis ajuster.
# (config/config.yaml est gitigné : c'est votre config locale personnelle.)

llm:
  # "llamacpp" (recommandé, conteneur llama.cpp fourni par le compose) | "ollama"
  backend: llamacpp
  # Docker : http://llamacpp:8080/v1 — Local : http://127.0.0.1:8080/v1
  base_url: http://llamacpp:8080/v1
  api_key: none
  model: gemma-4-E4B-it-qat-q4_0-unquantized-heretic-Q4_0
  temperature: 1.0
  top_p: 0.95
  max_context_tokens: 16384
  think: false            # désactive le thinking (Gemma 4)
  options: {}

server:
  host: 127.0.0.1
  port: 8000
  cors_origins:
    - http://localhost:5174
    - http://127.0.0.1:8000

paths:
  data_dir: ./server/data
  prompts_dir: ./server/prompts

relation:
  default_score: 100        # deux inconnus qui se rencontrent
  delta_max: 8              # plafond de progression par message
  delta_min: -10            # plancher de régression par message
  cooldown_hours: 24.0      # délai min entre deux scénarios injectés
  event_max_attempts: 3     # tours max avant consommation forcée d'un scénario
  event_consume_similarity: 0.55   # cosinus scénario ↔ réponse
  decay_days_grace: 3       # jours d'absence avant décroissance
  decay_points_per_day: 10  # points perdus par jour d'absence
  decay_max_loss: 150       # perte maximale cumulée
  summarize_every_turns: 10 # fréquence d'extraction de souvenirs
  max_memories: 40          # FIFO des souvenirs stockés
  # Messages proactifs du personnage (il écrit le premier après un silence)
  proactive_enabled: true
  proactive_after_hours: 24.0     # silence requis avant sa première initiative
  proactive_interval_hours: 24.0  # délai min entre deux initiatives (1 par jour)
  proactive_penalty: 50           # -points si message envoyé sans réponse au précédent
  proactive_check_seconds: 300    # période de la boucle de vérification
  proactive_first_delay_seconds: 30

memory:
  enabled: true
  # Docker : http://llamaembed:8080/v1 — Local : http://127.0.0.1:8081/v1
  embedding_base_url: http://llamaembed:8080/v1
  embedding_model: embeddinggemma
  top_k: 6                  # souvenirs rappelés par tour
  min_similarity: 0.30      # seuil de rappel (cosinus)

image:
  enabled: true
  base_url: ""              # vide → env COMFYUI_BASE_URL → http://127.0.0.1:8188
  timeout_total: 300
  # Initiative du personnage : photos envoyées de lui-même (stade Neutre+)
  initiative_enabled: true
  initiative_chance_turn: 0.10       # proba par tour de conversation
  initiative_chance_proactive: 0.30  # proba avec un message spontané
