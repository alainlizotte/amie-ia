# docker-compose.yml — Ami(e) IA (compagnon virtuel, serveur dédié)
#
# Démarrage (tout est inclus : serveur web, llama.cpp chat, embeddings) :
#   docker compose up -d --build
#
# Port : l'hôte écoute sur 8124 (conteneur interne 8000). Pour changer :
#   set AMIE_PORT=9000 && docker compose up -d
#
# llamacpp (chat) est publié sur 8082, llamaembed (embeddings) sur 8083
# pour coexister avec le projet D&D (8080/8081).
#
# ComfyUI (images) tourne sur l'hôte (8188) ; le conteneur y accède via
# host.docker.internal.
#
# Arrêt :
#   docker compose down        # les données (sessions, photos, users) sont conservées

services:
  amie-ia:
    build: .
    image: amie-ia:latest
    container_name: amie-ia
    ports:
      - "${AMIE_PORT:-8124}:8000"
    environment:
      AMIE_CONFIG: /app/config/config.yaml
      COMFYUI_BASE_URL: "http://host.docker.internal:8188"
      PRESETS_DIR: /app/data/character_presets
    volumes:
      # Configuration (écrasée par l'utilisateur, pas dans l'image).
      - ./config:/app/config:ro
      # Données runtime (sessions, historiques, photos, utilisateurs.json).
      - ./server/data:/app/server/data
      # Personnages prédéfinis + scénarios.
      - ./data/character_presets:/app/data/character_presets:ro
    restart: unless-stopped
    depends_on:
      llamacpp:
        condition: service_healthy
      llamaembed:
        condition: service_healthy
    networks:
      - amie-net

  # ── llama.cpp : serveur de chat (GPU NVIDIA) ──────────────────────────
  # Prérequis :
  #   1. Placer le modèle GGUF de chat dans ./models/
  #   2. Docker Desktop avec support GPU NVIDIA (WSL2)
  #
  # Sans GPU NVIDIA : remplacer l'image `server-cuda` par `server` et
  # retirer la section deploy.resources (inférence CPU, plus lente).
  #
# Flags :
#   -ngl ${LLAMACPP_NGL} (99 par défaut) : nombre de couches sur GPU
#           99 > nb de couches → modèle chargé EN ENTIER en VRAM.
#           Réduire (ex. 32) pour partager avec ComfyUI.
#   -c 16384           : contexte TOTAL (pool KV unifié). 32k ne tient pas en
#           VRAM avec un 9B Q5_K_M sur 8 Go → débordement RAM système et
#           effondrement de vitesse (1-2 tok/s). 16k ≈ 1,2 Go de KV (q8_0).
#   -n 4096            : max_tokens (aligné sur llm.max_tokens de config.yaml)
#   -np 1              : 1 slot → chaque requête dispose du contexte complet
#           (l'app sérialise les tours de toute façon).
#   -ctk q8_0 -ctv q8_0 : KV cache K/V en 8-bit (flash-attn requis, actif)
#   --jinja            : template Jinja native du modèle (Gemma 4 / Qwen 3.5)
#   --flash-attn on    : Flash Attention (réduit VRAM KV cache)
#   --cache-reuse 256  : réutilise le KV des tours précédents (prompt commun) ;
#           le préfill des longs historiques passe de ~60 s à < 1 s.
#   --no-mmproj-offload : projeteur vision (0,86 Go) gardé en RAM système —
#           la vision reste fonctionnelle, la VRAM est réservée au LLM.
#   --context-shift    : en fin de contexte, la conversation défile au lieu
#           d'échouer (les souvenirs de l'app compensent l'historique perdu).
#   --sleep-idle-seconds 300 : unload après 5 min d'inactivité
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: amie-llamacpp
    ports:
      # Port hôte 8082/8083 pour éviter la collision avec le projet D&D
      # (qui utilise déjà 8080/8081).
      - "${LLAMACPP_PORT:-8082}:8080"
    volumes:
      - ./models:/models
    command: >
      --host 0.0.0.0
      --port 8080
      --models-dir /models
      --models-max 1
      -ngl ${LLAMACPP_NGL:-99}
      -c 16384
      -n 4096
      -np 1
      -ctk q8_0
      -ctv q8_0
      --jinja
      --flash-attn on
      --cache-reuse 256
      --no-mmproj-offload
      --context-shift
      --sleep-idle-seconds 300
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - amie-net

  # ── llama.cpp : serveur d'embeddings (mémoire sémantique) ─────────────
  # Conteneur CPU dédié aux embeddings (modèle embeddinggemma-300M QAT Q4_0,
  # ~265 Mo, à placer dans ./models-embed/). Ne consomme AUCUNE VRAM.
  llamaembed:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: amie-llamaembed
    ports:
      # Port interne 8080 (exigé par le HEALTHCHECK de l'image), publié en
      # 8083 côte hôte (8081 est utilisé par le projet D&D).
      - "${LLAMAEMBED_PORT:-8083}:8080"
    volumes:
      - ./models-embed:/models
    command: >
      -m /models/embeddinggemma-300M-qat-Q4_0.gguf
      --host 0.0.0.0
      --port 8080
      --embedding
      -c 4096
      -np 1
      -b 4096
      -ub 4096
      --alias embeddinggemma
    restart: unless-stopped
    networks:
      - amie-net

networks:
  amie-net:
